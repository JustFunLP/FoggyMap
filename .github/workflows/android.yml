name: FoggyMap APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      emulator_test:
        description: 'Emulator-Test mit simulierter GPS-Fahrt ausführen (~25 min)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FOGGY_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (pre-installed on the runner, installed if missing)
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDK="$HOME/android-sdk"; mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d "$SDK/cmdline-tools" && mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          ls "$SDK/platforms"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Stable signing key (secret, or private draft release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_B64: ${{ secrets.FOGGY_KEYSTORE_B64 }}
          KEYSTORE_PW: ${{ secrets.FOGGY_KEYSTORE_PASSWORD }}
        run: |
          set -e
          K="$RUNNER_TEMP/foggy.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$K"; PW="$KEYSTORE_PW"
          else
            # A draft release is only visible to people with write access to this repository,
            # even if the repository is ever made public. The key never enters the git history.
            mkdir -p "$RUNNER_TEMP/key"
            if gh release download signing-key -D "$RUNNER_TEMP/key" -p 'foggy.*' 2>/dev/null; then
              cp "$RUNNER_TEMP/key/foggy.jks" "$K"; PW=$(cat "$RUNNER_TEMP/key/foggy.pass")
              echo "Using stored signing key."
            else
              PW=$(openssl rand -base64 30 | tr -d '/+=\n')
              keytool -genkeypair -keystore "$K" -storetype PKCS12 -alias foggymap -keyalg RSA -keysize 4096 \
                -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=FoggyMap, O=FoggyMap"
              cp "$K" "$RUNNER_TEMP/key/foggy.jks"; echo -n "$PW" > "$RUNNER_TEMP/key/foggy.pass"
              gh release create signing-key --draft --title "Signierschlüssel (privat, nicht löschen)" \
                --notes "Entwurf, nur für Repo-Mitglieder sichtbar. Wird für stabile App-Updates gebraucht." \
                "$RUNNER_TEMP/key/foggy.jks" "$RUNNER_TEMP/key/foggy.pass"
              echo "Created new signing key."
            fi
          fi
          echo "::add-mask::$PW"
          { echo "FOGGY_KEYSTORE_FILE=$K"; echo "FOGGY_KEYSTORE_PASSWORD=$PW"; echo "FOGGY_KEY_PASSWORD=$PW"; echo "FOGGY_KEY_ALIAS=foggymap"; } >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest --tests 'de.foggymap.app.core.*' 2>&1 | tee -a build.log

      - name: UI screenshots (Robolectric, never blocks the build)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          gradle --no-daemon :app:testDebugUnitTest --tests 'de.foggymap.app.ui.*' 2>&1 | tail -40 || true
          ls app/build/screenshots || true
          # Failures as annotations (logs are not readable from outside).
          python3 - <<'PY' || true
          import glob, re, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-de.foggymap.app.ui.*.xml'):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fail in list(tc.iter('failure')) + list(tc.iter('error')):
                      msg = (fail.get('message') or '') + ' | ' + (fail.text or '')[:900]
                      print('::warning title=Screenshot ' + tc.get('name') + '::' + re.sub(r'\s+', ' ', msg)[:1500])
          PY
          if ls app/build/screenshots/*.png >/dev/null 2>&1; then
            gh release view ui-shots >/dev/null 2>&1 || gh release create ui-shots --draft --title "UI-Screenshots (intern)" --notes "Robolectric-Screenshots der Oberfläche"
            gh release upload ui-shots app/build/screenshots/*.png --clobber
          fi

      - name: Koop relays (network test, never blocks the build)
        continue-on-error: true
        run: |
          gradle --no-daemon :app:testDebugUnitTest --tests 'de.foggymap.app.net.*' 2>&1 | tail -30 || true
          cat app/build/relay-check.txt 2>/dev/null || true
          python3 - <<'PY' || true
          import glob, re, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/test-results/testDebugUnitTest/TEST-de.foggymap.app.net.*.xml'):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fail in list(tc.iter('failure')) + list(tc.iter('error')):
                      msg = (fail.get('message') or '') + ' | ' + (fail.text or '')[:900]
                      print('::warning title=Relay-Test ' + tc.get('name') + '::' + re.sub(r'\s+', ' ', msg)[:1500])
          PY

      - name: Build APKs
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease :app:assembleDebug 2>&1 | tee -a build.log
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/FoggyMap.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/FoggyMap-debug.apk
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs out/FoggyMap.apk | head -5 || true
          ls -la out

      - name: Report build errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|> " build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done || true
          gh release view ci-log >/dev/null 2>&1 || gh release create ci-log --draft --title "CI-Protokoll (intern)" --notes "Letztes fehlgeschlagenes Build-Protokoll"
          gh release upload ci-log build.log --clobber || true

      - uses: actions/upload-artifact@v4
        with:
          name: FoggyMap-apk
          path: out/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Publish download link (GitHub Release "FoggyMap neueste Version")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          SHA=$(sha256sum out/FoggyMap.apk | cut -d' ' -f1)
          printf '{"versionCode": %s, "versionName": "1.0.%s", "sha256": "%s", "commit": "%s"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" "$SHA" "${{ github.sha }}" > out/version.json
          cat out/version.json
          gh release create apk-latest out/FoggyMap.apk out/version.json \
            --title "FoggyMap – neueste Version (Build ${{ github.run_number }})" \
            --notes "Automatisch gebaut aus ${{ github.sha }}. Auf dem Handy FoggyMap.apk antippen und installieren." \
            --latest

  server-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Koop-Server tests (Node + Cloudflare-Worker-Logik)
        working-directory: server
        run: npm test

  # Runs only when started by hand (Actions → FoggyMap APK → Run workflow → "Emulator-Test" ticked).
  # A failing emulator test never marks the APK build as failed.
  emulator-test:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.emulator_test
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: FoggyMap-apk
          path: out

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator test (simulated 1.1 km GPS route through Helsinki)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash scripts/e2e.sh

      - name: Publish test results
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la e2e-out || true
          cat e2e-out/summary.txt >> "$GITHUB_STEP_SUMMARY" || true
          while IFS= read -r line; do echo "::notice::$line"; done < e2e-out/summary.txt || true
          gh release view e2e-latest >/dev/null 2>&1 || gh release create e2e-latest --draft --title "Emulator-Test (intern)" --notes "Screenshots und Logs des letzten Emulator-Tests"
          gzip -kf e2e-out/logcat-full.txt || true
          gh release upload e2e-latest e2e-out/*.png e2e-out/summary.txt e2e-out/logcat-app.txt e2e-out/logcat-full.txt.gz --clobber || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test
          path: e2e-out/
          if-no-files-found: ignore
